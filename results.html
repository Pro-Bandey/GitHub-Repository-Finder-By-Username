<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="shortcut icon" href="github-mark.png" type="image/x-icon">

    <title>GitHub Repositories - Results</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Rate Limit Warning -->
    <div id="rate-limit-warning" class="alert alert-warning text-center"
        style="display:none; position:fixed; top:0; width:100%; z-index:9999;">
        <strong>API Limit Reached!</strong> You may see incomplete data. Try again in an hour.
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="box-container">
                    <a href="./" class="btn btn-sm btn-outline-light mb-3">&larr; Back to Search</a>

                    <!-- Profile Section -->
                    <div id="user-profile" class="user-details text-center">
                        <!-- Skeleton for Profile -->
                        <div class="skeleton skeleton-avatar mx-auto"></div>
                        <div class="skeleton skeleton-text mx-auto mt-2" style="width: 50%;"></div>
                    </div>

                    <hr class="border-secondary">

                    <!-- Stats Chart -->
                    <div class="chart-container mb-4" style="position: relative; height:30vh; width:100%; display:none;"
                        id="chart-wrapper">
                        <canvas id="langChart"></canvas>
                    </div>

                    <!-- Controls -->
                    <div class="row mb-3">
                        <div class="col-md-4 mb-2">
                            <select id="sortRepos" class="form-control">
                                <option value="updated">Sort: Last Updated</option>
                                <option value="stars">Sort: Most Stars</option>
                                <option value="forks">Sort: Most Forks</option>
                                <option value="created">Sort: Newest Created</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <input type="text" id="searchRepo" class="form-control"
                                placeholder="Search in repositories...">
                        </div>
                    </div>

                    <!-- Loader -->
                    <div id="loader" class="text-center" style="display:none;">
                        <div class="spinner-border text-success" role="status"></div>
                    </div>

                    <!-- Repositories List -->
                    <div id="repositories">
                        <!-- Skeletons for Repos -->
                        <div class="skeleton skeleton-card"></div>
                        <div class="skeleton skeleton-card"></div>
                        <div class="skeleton skeleton-card"></div>
                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="results.js"></script>
</body>

</html>
